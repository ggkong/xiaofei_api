name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  conversation-archive:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: archive_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d archive_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify archive storage and HTTP access boundaries
        working-directory: backend
        env:
          ARCHIVE_TEST_DSN: postgres://postgres@127.0.0.1:5432/archive_test?sslmode=disable
        run: go test -count=1 ./internal/conversationarchive ./internal/server/routes -run 'TestStorePostgresLifecycle|TestConversationArchiveHTTPPostgresLifecycle|TestLocalArchivePostgresVerifiedMigration'

  archive-desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test Windows storage and protected identity
        working-directory: backend
        run: go test ./internal/archivewire ./internal/localarchive ./cmd/archive-desktop
      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          Get-ChildItem deploy/archive-desktop/*.ps1 | ForEach-Object {
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh

  custom-release-inputs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/admin-conversation-archive'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOMEMLIMIT: 5GiB
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build reviewed frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm run build:archive
      - name: Build custom release binaries
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/custom-release/web
          go build -p 2 -tags embed -trimpath -ldflags "-s -w -X main.Version=0.2.21-custom.1 -X main.Commit=$GITHUB_SHA -X main.BuildType=release" -o /tmp/custom-release/sub2api ./cmd/server
          go build -p 2 -trimpath -ldflags '-s -w' -o /tmp/custom-release/archive-maintenance ./cmd/archive-maintenance
          cp -a internal/web/dist/. /tmp/custom-release/web/
          go version > /tmp/custom-release/go-version.txt
          printf '%s\n' "$GITHUB_SHA" > /tmp/custom-release/source-commit.txt
          cd /tmp/custom-release
          sha256sum sub2api archive-maintenance web/index.html > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: custom-release-${{ github.sha }}
          path: /tmp/custom-release/
          retention-days: 3
          compression-level: 1
          if-no-files-found: error
